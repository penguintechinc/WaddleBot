# =============================================================================
# CONSUMERS - API Consumers for Auth & Rate Limiting
# =============================================================================

consumers:
  - username: anonymous
    custom_id: anonymous-consumer
    tags:
      - anonymous

  - username: authenticated-user
    custom_id: authenticated-user
    tags:
      - authenticated

  - username: service-account
    custom_id: service-account
    tags:
      - service
      - internal

# =============================================================================
# PLUGINS - Global Configuration
# =============================================================================

plugins:
  # --- Global CORS ---
  - name: cors
    config:
      origins:
        - "https://hub.waddlebot.io"
        - "https://waddlebot.io"
        - "https://api.waddlebot.io"
        - "https://waddles.penguintech.cloud"
        - "https://waddlebot.penguintech.cloud"
        - "http://localhost:3000"
        - "http://localhost:8060"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
        - HEAD
      headers:
        - Authorization
        - Content-Type
        - X-API-Key
        - X-Request-ID
        - X-Requested-With
        - Accept
        - Origin
      exposed_headers:
        - X-Request-ID
        - X-RateLimit-Limit
        - X-RateLimit-Remaining
        - X-RateLimit-Reset
      credentials: true
      max_age: 3600
      preflight_continue: false
    tags:
      - global
      - cors

  # --- Global Request Size Limit ---
  - name: request-size-limiting
    config:
      allowed_payload_size: 10
      size_unit: megabytes
    tags:
      - global
      - security

  # --- Global Rate Limiting ---
  - name: rate-limiting
    config:
      minute: 60
      hour: 1000
      policy: local
      fault_tolerant: true
      hide_client_headers: false
      error_code: 429
      error_message: "Rate limit exceeded. Please slow down."
    tags:
      - global
      - rate-limiting

  # --- Request ID for tracing ---
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true
    tags:
      - global
      - tracing
