# Kong Declarative Configuration for Waddles API Gateway
# All APIs exposed via api.waddlebot.io - No direct external access to services
# Excludes: Frontend, webhook receivers, OBS overlays (separate systems)

_format_version: "3.0"

# =============================================================================
# SERVICES - Backend API Modules with Nested Routes
# =============================================================================

services:
  # Hub Module - Main API (user, community, admin, auth)
  - name: hub-service
    url: http://hub:8060
    connect_timeout: 10000
    read_timeout: 60000
    write_timeout: 60000
    retries: 3
    tags:
      - waddlebot
      - hub
      - core
    routes:
      - name: hub-public
        paths:
          - /api/v1/public
        strip_path: false
        protocols:
          - http
          - https
        tags:
          - public
          - no-auth
      - name: hub-auth
        paths:
          - /api/v1/auth
        strip_path: false
        protocols:
          - http
          - https
        tags:
          - auth
          - no-auth
      - name: hub-user
