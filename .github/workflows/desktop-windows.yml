name: Desktop Bridge - Windows
# DISABLED: source code not present in repo (v2.2.x consolidation)

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Premium/Desktop/**'
      - '.github/workflows/desktop-windows.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Premium/Desktop/**'
  workflow_dispatch:

env:
  GO_VERSION: '1.24'
  CGO_ENABLED: 0

jobs:
  lint:
    if: false
    name: Lint (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Premium/Desktop
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: Premium/Desktop/go.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m

  test:
    if: false
    name: Test (Windows)
    runs-on: windows-latest
    needs: lint
    defaults:
      run:
        working-directory: Premium/Desktop
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: Premium/Desktop/go.sum

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v6
        with:
          files: Premium/Desktop/coverage.out
          flags: desktop-windows

  build:
    if: false
    name: Build (Windows AMD64)
    runs-on: windows-latest
    needs: test
    defaults:
      run:
        working-directory: Premium/Desktop
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: Premium/Desktop/go.sum

      - name: Build binary
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -v -trimpath -ldflags="-s -w" -o waddlebot-bridge-windows-amd64.exe ./cmd/main.go

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: waddlebot-bridge-windows-amd64
          path: Premium/Desktop/waddlebot-bridge-windows-amd64.exe
          retention-days: 30
