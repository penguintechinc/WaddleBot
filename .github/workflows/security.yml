name: Security & Code Quality

on:
  push:
    branches: [main, develop, 'v*']
  pull_request:
    branches: [main, develop, 'v*']
  merge_group:
    types: [checks_requested]
    branches: [main, develop, 'v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write
  actions: read

jobs:
  # Fast checks (~2-3 min): Trivy fs, pip-audit, npm audit, Dependency Review
  # This is the check that matters for day-to-day development velocity.
  security-fast:
    name: Security & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          limit-severities-for-sarif: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225  # v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48  # v4
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
          # The affected React Router code is limited to unstable RSC APIs,
          # which this Vite SPA does not use. react-router-dom 8.3.0 is not
          # published yet; keep this aligned with the npm-audit allowance above.
          allow-ghsas: GHSA-qwww-vcr4-c8h2

  node-audit:
    name: Node audit (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Hub backend
            path: admin/hub_module/backend
          - name: Hub frontend
            path: admin/hub_module/frontend
            # No patched stable React Router release exists for this advisory.
            # Remove this allowance as soon as react-router-dom >=8.3.0 is published.
            audit_allow: GHSA-qwww-vcr4-c8h2
          - name: Marketplace
            path: admin/marketplace_module/backend
          - name: Website
            path: website
          - name: API tests
            path: tests/api/hub-backend
          - name: End-to-end tests
            path: tests/e2e
          - name: Integration tests
            path: tests/integration
          - name: Smoke tests
            path: tests/smoke
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@penguintechinc'

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        env:
          NPM_AUDIT_ALLOW: ${{ matrix.audit_allow }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/npm-audit.mjs"

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit

      - name: Audit changed Python dependency set
        run: python -m pip_audit -r action/pushing/googlechat_action_module/requirements.txt

  # Slow static analysis (~17-21 min): CodeQL on go/javascript/python.
  # Runs in parallel with builds -- does NOT gate container builds or any other jobs.
  # Pre-existing OS-level CVEs in bookworm base images cause false positives;
  # continue-on-error prevents them from blocking the pipeline.
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@95e58e9a2cdfd71adc6e0353d5c52f41a045d225  # v4
        with:
          languages: go, javascript, python

      - name: Autobuild
        uses: github/codeql-action/autobuild@95e58e9a2cdfd71adc6e0353d5c52f41a045d225  # v4

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@95e58e9a2cdfd71adc6e0353d5c52f41a045d225  # v4
