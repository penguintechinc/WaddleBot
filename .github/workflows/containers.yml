name: Container Builds

on:
  push:
    branches: [ main, 'v*', develop, 'feature/**', 'bugfix/**' ]
    paths:
      - 'processing/router_module/**'
      - 'trigger/receiver/**'
      - 'action/interactive/**'
      - 'action/pushing/**'
      - 'action/security/**'
      - 'core/**'
      - 'admin/hub_module/**'
      - 'admin/marketplace_module/**'
      - 'libs/flask_core/**'
      - 'docker-compose.yml'
      - '.version'
      - '.github/workflows/containers.yml'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Determine version and tag suffix
  determine-version:
    name: Determine Version and Tags
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      suffix: ${{ steps.version.outputs.suffix }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine version and suffix
        id: version
        run: |
          # Read version from .version file
          if [ -f .version ]; then
            VERSION=$(cat .version | tr -d '[:space:]')
          else
            VERSION="0.0.0"
          fi

          echo "version=v${VERSION}" >> $GITHUB_OUTPUT

          # Check if .version file changed (indicates a release)
          if git diff HEAD^ HEAD --name-only | grep -q "^.version$"; then
            IS_RELEASE="true"
          else
            IS_RELEASE="false"
          fi

          # Determine suffix based on branch and release status
          if [ "$IS_RELEASE" = "true" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # Version release on main: no suffix, plus 'latest' tag
            SUFFIX=""
            echo "suffix=" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "Building RELEASE: v${VERSION} and latest"
          elif [[ "${{ github.ref }}" == refs/heads/v* ]]; then
            # Release branch (v*.x), not a release: -beta suffix
            SUFFIX="-beta"
            echo "suffix=-beta" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "Building BETA: v${VERSION}-beta"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # Main branch, not a release: -gamma suffix
            SUFFIX="-gamma"
            echo "suffix=-gamma" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "Building GAMMA: v${VERSION}-gamma"
          else
            # Non-main, non-release branch: -alpha suffix
            SUFFIX="-alpha"
            echo "suffix=-alpha" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "Building ALPHA: v${VERSION}-alpha"
          fi

  # Detect changed modules
  detect-changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      router: ${{ steps.changes.outputs.router }}
      marketplace: ${{ steps.changes.outputs.marketplace }}
      hub: ${{ steps.changes.outputs.hub }}
      collector-twitch: ${{ steps.changes.outputs.collector-twitch }}
      collector-discord: ${{ steps.changes.outputs.collector-discord }}
      collector-slack: ${{ steps.changes.outputs.collector-slack }}
      collector-youtube: ${{ steps.changes.outputs.collector-youtube }}
      collector-kick: ${{ steps.changes.outputs.collector-kick }}
      interactive-ai: ${{ steps.changes.outputs.interactive-ai }}
      interactive-inventory: ${{ steps.changes.outputs.interactive-inventory }}
      interactive-alias: ${{ steps.changes.outputs.interactive-alias }}
      interactive-shoutout: ${{ steps.changes.outputs.interactive-shoutout }}
      interactive-calendar: ${{ steps.changes.outputs.interactive-calendar }}
      interactive-memories: ${{ steps.changes.outputs.interactive-memories }}
      interactive-clip: ${{ steps.changes.outputs.interactive-clip }}
      interactive-lfg: ${{ steps.changes.outputs.interactive-lfg }}
      interactive-loyalty: ${{ steps.changes.outputs.interactive-loyalty }}
      interactive-server-manager: ${{ steps.changes.outputs.interactive-server-manager }}
      interactive-server-status: ${{ steps.changes.outputs.interactive-server-status }}
      interactive-spotify: ${{ steps.changes.outputs.interactive-spotify }}
      interactive-translate: ${{ steps.changes.outputs.interactive-translate }}
      interactive-youtube-music: ${{ steps.changes.outputs.interactive-youtube-music }}
      core-labels: ${{ steps.changes.outputs.core-labels }}
      core-identity: ${{ steps.changes.outputs.core-identity }}
      core-browser-source: ${{ steps.changes.outputs.core-browser-source }}
      core-reputation: ${{ steps.changes.outputs.core-reputation }}
      core-community: ${{ steps.changes.outputs.core-community }}
      ai-researcher: ${{ steps.changes.outputs.ai-researcher }}
      core-video-proxy: ${{ steps.changes.outputs.core-video-proxy }}
      core-engagement: ${{ steps.changes.outputs.core-engagement }}
      core-module-rtc: ${{ steps.changes.outputs.core-module-rtc }}
      core-workflow: ${{ steps.changes.outputs.core-workflow }}
      core-analytics: ${{ steps.changes.outputs.core-analytics }}
      core-credential-manager: ${{ steps.changes.outputs.core-credential-manager }}
      core-security: ${{ steps.changes.outputs.core-security }}
      action-discord: ${{ steps.changes.outputs.action-discord }}
      action-slack: ${{ steps.changes.outputs.action-slack }}
      action-twitch: ${{ steps.changes.outputs.action-twitch }}
      action-youtube: ${{ steps.changes.outputs.action-youtube }}
      libs: ${{ steps.changes.outputs.libs }}
      migrations: ${{ steps.changes.outputs.migrations }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            router:
              - 'processing/router_module/**'
              - 'libs/**'
            marketplace:
              - 'admin/marketplace_module/**'
              - 'libs/**'
            hub:
              - 'admin/hub_module/**'
              - 'libs/**'
            collector-twitch:
              - 'trigger/receiver/twitch_module/**'
              - 'libs/**'
            collector-discord:
              - 'trigger/receiver/discord_module/**'
              - 'libs/**'
            collector-slack:
              - 'trigger/receiver/slack_module/**'
              - 'libs/**'
            collector-youtube:
              - 'trigger/receiver/youtube_live_module/**'
              - 'libs/**'
            collector-kick:
              - 'trigger/receiver/kick_module_flask/**'
              - 'libs/**'
            interactive-ai:
              - 'action/interactive/ai_interaction_module/**'
              - 'libs/**'
            interactive-inventory:
              - 'action/interactive/inventory_interaction_module/**'
              - 'libs/**'
            interactive-alias:
              - 'action/interactive/alias_interaction_module/**'
              - 'libs/**'
            interactive-shoutout:
              - 'action/interactive/shoutout_interaction_module/**'
              - 'libs/**'
            interactive-calendar:
              - 'action/interactive/calendar_interaction_module/**'
              - 'libs/**'
            interactive-memories:
              - 'action/interactive/memories_interaction_module/**'
              - 'libs/**'
            interactive-clip:
              - 'action/interactive/clip_interaction_module/**'
              - 'libs/**'
            interactive-lfg:
              - 'action/interactive/lfg_interaction_module/**'
              - 'libs/**'
            interactive-loyalty:
              - 'action/interactive/loyalty_interaction_module/**'
              - 'libs/**'
            interactive-server-manager:
              - 'action/interactive/server_manager_interaction_module/**'
              - 'libs/**'
            interactive-server-status:
              - 'action/interactive/server_status_interaction_module/**'
              - 'libs/**'
            interactive-spotify:
              - 'action/interactive/spotify_interaction_module/**'
              - 'libs/**'
            interactive-translate:
              - 'action/interactive/translate_interaction_module/**'
              - 'libs/**'
            interactive-youtube-music:
              - 'action/interactive/youtube_music_interaction_module/**'
              - 'libs/**'
            core-labels:
              - 'core/labels_core_module/**'
              - 'libs/**'
            core-identity:
              - 'core/identity_core_module/**'
              - 'libs/**'
            core-browser-source:
              - 'core/browser_source_core_module/**'
              - 'libs/**'
            core-reputation:
              - 'core/reputation_module/**'
              - 'libs/**'
            core-community:
              - 'core/community_module/**'
              - 'libs/**'
            ai-researcher:
              - 'core/ai_researcher_module/**'
              - 'libs/**'
            core-video-proxy:
              - 'core/video_proxy_module/**'
              - 'libs/**'
            core-engagement:
              - 'core/engagement_module/**'
              - 'libs/**'
            core-module-rtc:
              - 'core/module_rtc/**'
              - 'libs/**'
            core-workflow:
              - 'core/workflow_core_module/**'
              - 'libs/**'
            core-analytics:
              - 'core/analytics_core_module/**'
              - 'libs/**'
            core-credential-manager:
              - 'core/credential_manager_module/**'
              - 'libs/**'
            core-security:
              - 'core/security_core_module/**'
              - 'libs/**'
            action-discord:
              - 'action/pushing/discord_action_module/**'
              - 'libs/**'
            action-slack:
              - 'action/pushing/slack_action_module/**'
              - 'libs/**'
            action-twitch:
              - 'action/pushing/twitch_action_module/**'
              - 'libs/**'
            action-youtube:
              - 'action/pushing/youtube_action_module/**'
              - 'libs/**'
            libs:
              - 'libs/**'
            migrations:
              - 'migrations/**'

  # Build core modules
  build-core:
    name: Build Core Modules
    runs-on: ubuntu-latest
    needs: [determine-version, detect-changes]
    if: >
      needs.detect-changes.outputs.router == 'true' ||
      needs.detect-changes.outputs.marketplace == 'true' ||
      needs.detect-changes.outputs.migrations == 'true' ||
      needs.detect-changes.outputs.core-labels == 'true' ||
      needs.detect-changes.outputs.core-identity == 'true' ||
      needs.detect-changes.outputs.core-browser-source == 'true' ||
      needs.detect-changes.outputs.core-reputation == 'true' ||
      needs.detect-changes.outputs.core-community == 'true' ||
      needs.detect-changes.outputs.ai-researcher == 'true' ||
      needs.detect-changes.outputs.core-video-proxy == 'true' ||
      needs.detect-changes.outputs.core-engagement == 'true' ||
      needs.detect-changes.outputs.core-module-rtc == 'true' ||
      needs.detect-changes.outputs.core-workflow == 'true' ||
      needs.detect-changes.outputs.core-analytics == 'true' ||
      needs.detect-changes.outputs.core-credential-manager == 'true' ||
      needs.detect-changes.outputs.core-security == 'true' ||
      needs.detect-changes.outputs.libs == 'true' ||
      github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: processing/router_module
            name: router
            port: 8000
            condition: ${{ needs.detect-changes.outputs.router == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: admin/marketplace_module
            name: marketplace
            port: 8001
            condition: ${{ needs.detect-changes.outputs.marketplace == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - name: migrations
            dockerfile: ./migrations/Dockerfile
            port: 0
            context: .
            condition: ${{ needs.detect-changes.outputs.migrations == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: core/labels_core_module
            name: core-labels
            port: 0
            condition: ${{ needs.detect-changes.outputs.core-labels == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: core/identity_core_module
            name: core-identity
            port: 0
            condition: ${{ needs.detect-changes.outputs.core-identity == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: core/browser_source_core_module
            name: core-browser-source
            port: 0
            condition: ${{ needs.detect-changes.outputs.core-browser-source == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: core/reputation_module
            name: core-reputation
            port: 0
            condition: ${{ needs.detect-changes.outputs.core-reputation == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: core/community_module
            name: core-community
            port: 0
            condition: ${{ needs.detect-changes.outputs.core-community == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: core/ai_researcher_module
            name: ai-researcher
            port: 0
            condition: ${{ needs.detect-changes.outputs.ai-researcher == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: core/video_proxy_module
            name: core-video-proxy
            port: 0
            condition: ${{ needs.detect-changes.outputs.core-video-proxy == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: core/engagement_module
            name: core-engagement
            port: 0
            condition: ${{ needs.detect-changes.outputs.core-engagement == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: core/module_rtc
            name: core-module-rtc
            port: 0
            condition: ${{ needs.detect-changes.outputs.core-module-rtc == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: core/workflow_core_module
            name: core-workflow
            port: 0
            condition: ${{ needs.detect-changes.outputs.core-workflow == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: core/analytics_core_module
            name: core-analytics
            port: 0
            condition: ${{ needs.detect-changes.outputs.core-analytics == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: core/credential_manager_module
            name: core-credential-manager
            port: 0
            condition: ${{ needs.detect-changes.outputs.core-credential-manager == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: core/security_core_module
            name: core-security
            port: 0
            condition: ${{ needs.detect-changes.outputs.core-security == 'true' || needs.detect-changes.outputs.libs == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}
            type=raw,value=latest,enable=${{ needs.determine-version.outputs.is_release == 'true' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        if: matrix.condition == 'true' || github.event_name == 'workflow_dispatch'
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile || format('./{0}/Dockerfile', matrix.module) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            MODULE_NAME=${{ matrix.name }}
            MODULE_PORT=${{ matrix.port }}

      - name: Run container tests
        if: (matrix.condition == 'true' || github.event_name == 'workflow_dispatch') && matrix.port != 0
        run: |
          # Test the built image
          docker run --rm --name test-${{ matrix.name }} -d -p ${{ matrix.port }}:${{ matrix.port }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.name }}:${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}
          sleep 10

          # Health check
          if curl -f http://localhost:${{ matrix.port }}/health; then
            echo "Health check passed for ${{ matrix.name }}"
          else
            echo "Health check failed for ${{ matrix.name }}"
            exit 1
          fi

          # Stop container
          docker stop test-${{ matrix.name }}

  # Build collector modules
  build-collectors:
    name: Build Collector Modules
    runs-on: ubuntu-latest
    needs: [determine-version, detect-changes]
    if: >
      needs.detect-changes.outputs.collector-twitch == 'true' ||
      needs.detect-changes.outputs.collector-discord == 'true' ||
      needs.detect-changes.outputs.collector-slack == 'true' ||
      needs.detect-changes.outputs.collector-youtube == 'true' ||
      needs.detect-changes.outputs.collector-kick == 'true' ||
      needs.detect-changes.outputs.libs == 'true' ||
      github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: trigger/receiver/twitch_module
            name: collector-twitch
            port: 8010
            condition: ${{ needs.detect-changes.outputs.collector-twitch == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: trigger/receiver/discord_module
            name: collector-discord
            port: 8011
            condition: ${{ needs.detect-changes.outputs.collector-discord == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: trigger/receiver/slack_module
            name: collector-slack
            port: 8012
            condition: ${{ needs.detect-changes.outputs.collector-slack == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: trigger/receiver/youtube_live_module
            name: collector-youtube
            port: 0
            condition: ${{ needs.detect-changes.outputs.collector-youtube == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: trigger/receiver/kick_module_flask
            name: collector-kick
            port: 0
            condition: ${{ needs.detect-changes.outputs.collector-kick == 'true' || needs.detect-changes.outputs.libs == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}
            type=raw,value=latest,enable=${{ needs.determine-version.outputs.is_release == 'true' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        if: matrix.condition == 'true' || github.event_name == 'workflow_dispatch'
        with:
          context: .
          file: ./${{ matrix.module }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            MODULE_NAME=${{ matrix.name }}
            MODULE_PORT=${{ matrix.port }}

      - name: Run container tests
        if: (matrix.condition == 'true' || github.event_name == 'workflow_dispatch') && matrix.port != 0
        run: |
          # Test the built image
          docker run --rm --name test-${{ matrix.name }} -d -p ${{ matrix.port }}:${{ matrix.port }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.name }}:${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}
          sleep 10

          # Health check
          if curl -f http://localhost:${{ matrix.port }}/health; then
            echo "Health check passed for ${{ matrix.name }}"
          else
            echo "Health check failed for ${{ matrix.name }}"
            exit 1
          fi

          # Stop container
          docker stop test-${{ matrix.name }}

  # Build interaction modules
  build-interactions:
    name: Build Interaction Modules
    runs-on: ubuntu-latest
    needs: [determine-version, detect-changes]
    if: >
      needs.detect-changes.outputs.interactive-ai == 'true' ||
      needs.detect-changes.outputs.interactive-inventory == 'true' ||
      needs.detect-changes.outputs.interactive-alias == 'true' ||
      needs.detect-changes.outputs.interactive-shoutout == 'true' ||
      needs.detect-changes.outputs.interactive-calendar == 'true' ||
      needs.detect-changes.outputs.interactive-memories == 'true' ||
      needs.detect-changes.outputs.interactive-clip == 'true' ||
      needs.detect-changes.outputs.interactive-lfg == 'true' ||
      needs.detect-changes.outputs.interactive-loyalty == 'true' ||
      needs.detect-changes.outputs.interactive-server-manager == 'true' ||
      needs.detect-changes.outputs.interactive-server-status == 'true' ||
      needs.detect-changes.outputs.interactive-spotify == 'true' ||
      needs.detect-changes.outputs.interactive-translate == 'true' ||
      needs.detect-changes.outputs.interactive-youtube-music == 'true' ||
      needs.detect-changes.outputs.libs == 'true' ||
      github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: action/interactive/ai_interaction_module
            name: interactive-ai
            port: 8020
            condition: ${{ needs.detect-changes.outputs.interactive-ai == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: action/interactive/inventory_interaction_module
            name: interactive-inventory
            port: 8024
            condition: ${{ needs.detect-changes.outputs.interactive-inventory == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: action/interactive/alias_interaction_module
            name: interactive-alias
            port: 8022
            condition: ${{ needs.detect-changes.outputs.interactive-alias == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: action/interactive/shoutout_interaction_module
            name: interactive-shoutout
            port: 8023
            condition: ${{ needs.detect-changes.outputs.interactive-shoutout == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: action/interactive/calendar_interaction_module
            name: interactive-calendar
            port: 0
            condition: ${{ needs.detect-changes.outputs.interactive-calendar == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: action/interactive/memories_interaction_module
            name: interactive-memories
            port: 0
            condition: ${{ needs.detect-changes.outputs.interactive-memories == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: action/interactive/clip_interaction_module
            name: interactive-clip
            port: 0
            condition: ${{ needs.detect-changes.outputs.interactive-clip == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: action/interactive/lfg_interaction_module
            name: interactive-lfg
            port: 0
            condition: ${{ needs.detect-changes.outputs.interactive-lfg == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: action/interactive/loyalty_interaction_module
            name: interactive-loyalty
            port: 0
            condition: ${{ needs.detect-changes.outputs.interactive-loyalty == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: action/interactive/server_manager_interaction_module
            name: interactive-server-manager
            port: 0
            condition: ${{ needs.detect-changes.outputs.interactive-server-manager == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: action/interactive/server_status_interaction_module
            name: interactive-server-status
            port: 0
            condition: ${{ needs.detect-changes.outputs.interactive-server-status == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: action/interactive/spotify_interaction_module
            name: interactive-spotify
            port: 0
            condition: ${{ needs.detect-changes.outputs.interactive-spotify == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: action/interactive/translate_interaction_module
            name: interactive-translate
            port: 0
            condition: ${{ needs.detect-changes.outputs.interactive-translate == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: action/interactive/youtube_music_interaction_module
            name: interactive-youtube-music
            port: 0
            condition: ${{ needs.detect-changes.outputs.interactive-youtube-music == 'true' || needs.detect-changes.outputs.libs == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}
            type=raw,value=latest,enable=${{ needs.determine-version.outputs.is_release == 'true' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        if: matrix.condition == 'true' || github.event_name == 'workflow_dispatch'
        with:
          context: .
          file: ./${{ matrix.module }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            MODULE_NAME=${{ matrix.name }}
            MODULE_PORT=${{ matrix.port }}

      - name: Run container tests
        if: (matrix.condition == 'true' || github.event_name == 'workflow_dispatch') && matrix.port != 0
        run: |
          # Test the built image
          docker run --rm --name test-${{ matrix.name }} -d -p ${{ matrix.port }}:${{ matrix.port }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.name }}:${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}
          sleep 10

          # Health check
          if curl -f http://localhost:${{ matrix.port }}/health; then
            echo "Health check passed for ${{ matrix.name }}"
          else
            echo "Health check failed for ${{ matrix.name }}"
            exit 1
          fi

          # Stop container
          docker stop test-${{ matrix.name }}

  # Build admin modules (hub-api, hub-webui)
  build-admin:
    name: Build Admin Modules
    runs-on: ubuntu-latest
    needs: [determine-version, detect-changes]
    if: needs.detect-changes.outputs.hub == 'true' || needs.detect-changes.outputs.libs == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hub-api
            dockerfile: ./admin/hub_module/Dockerfile
            port: 3000
            condition: ${{ needs.detect-changes.outputs.hub == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - name: hub-webui
            dockerfile: ./admin/hub_module/Dockerfile.webui
            port: 5173
            condition: ${{ needs.detect-changes.outputs.hub == 'true' || needs.detect-changes.outputs.libs == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}
            type=raw,value=latest,enable=${{ needs.determine-version.outputs.is_release == 'true' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        if: matrix.condition == 'true' || github.event_name == 'workflow_dispatch'
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            MODULE_NAME=${{ matrix.name }}
            MODULE_PORT=${{ matrix.port }}
            NPM_TOKEN=${{ secrets.GITHUB_TOKEN }}

  # Build action/pushing modules
  build-actions:
    name: Build Action Modules
    runs-on: ubuntu-latest
    needs: [determine-version, detect-changes]
    if: >
      needs.detect-changes.outputs.action-discord == 'true' ||
      needs.detect-changes.outputs.action-slack == 'true' ||
      needs.detect-changes.outputs.action-twitch == 'true' ||
      needs.detect-changes.outputs.action-youtube == 'true' ||
      needs.detect-changes.outputs.libs == 'true' ||
      github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: action/pushing/discord_action_module
            name: action-discord
            port: 0
            condition: ${{ needs.detect-changes.outputs.action-discord == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: action/pushing/slack_action_module
            name: action-slack
            port: 0
            condition: ${{ needs.detect-changes.outputs.action-slack == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: action/pushing/twitch_action_module
            name: action-twitch
            port: 0
            condition: ${{ needs.detect-changes.outputs.action-twitch == 'true' || needs.detect-changes.outputs.libs == 'true' }}
          - module: action/pushing/youtube_action_module
            name: action-youtube
            port: 0
            condition: ${{ needs.detect-changes.outputs.action-youtube == 'true' || needs.detect-changes.outputs.libs == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}
            type=raw,value=latest,enable=${{ needs.determine-version.outputs.is_release == 'true' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        if: matrix.condition == 'true' || github.event_name == 'workflow_dispatch'
        with:
          context: .
          file: ./${{ matrix.module }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            MODULE_NAME=${{ matrix.name }}
            MODULE_PORT=${{ matrix.port }}

      - name: Run container tests
        if: (matrix.condition == 'true' || github.event_name == 'workflow_dispatch') && matrix.port != 0
        run: |
          # Test the built image
          docker run --rm --name test-${{ matrix.name }} -d -p ${{ matrix.port }}:${{ matrix.port }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.name }}:${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}
          sleep 10

          # Health check
          if curl -f http://localhost:${{ matrix.port }}/health; then
            echo "Health check passed for ${{ matrix.name }}"
          else
            echo "Health check failed for ${{ matrix.name }}"
            exit 1
          fi

          # Stop container
          docker stop test-${{ matrix.name }}

  # Integration tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [determine-version, build-core, build-collectors, build-interactions, build-admin, build-actions]
    if: always() && (needs.build-core.result == 'success' || needs.build-collectors.result == 'success' || needs.build-interactions.result == 'success' || needs.build-admin.result == 'success' || needs.build-actions.result == 'success')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Start services
        run: |
          # Use the version-tagged built images
          export REGISTRY=${{ env.REGISTRY }}
          export IMAGE_NAME=${{ env.IMAGE_NAME }}
          export TAG=${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}

          # Start core services
          docker-compose -f docker-compose.yml up -d infra-postgres infra-redis

          # Wait for services to be ready
          sleep 30

          # Start application services
          docker-compose -f docker-compose.yml up -d

      - name: Run integration tests
        run: |
          # Wait for all services to be ready
          sleep 60

          # Test router health
          curl -f http://localhost:8000/health || exit 1

          # Test marketplace health
          curl -f http://localhost:8001/health || exit 1

          # Test portal health
          curl -f http://localhost:8002/health || exit 1

          echo "All integration tests passed"

      - name: Cleanup
        if: always()
        run: docker-compose -f docker-compose.yml down -v

  # Security scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [determine-version, build-core, build-collectors, build-interactions, build-admin, build-actions]
    if: always() && (needs.build-core.result == 'success' || needs.build-collectors.result == 'success' || needs.build-interactions.result == 'success' || needs.build-admin.result == 'success' || needs.build-actions.result == 'success')
    strategy:
      matrix:
        image:
          - router
          - marketplace
          - hub-api
          - hub-webui
          - collector-twitch
          - collector-discord
          - collector-slack
          - collector-youtube
          - collector-kick
          - interactive-ai
          - interactive-inventory
          - interactive-alias
          - interactive-shoutout
          - interactive-calendar
          - interactive-memories
          - interactive-clip
          - interactive-lfg
          - interactive-loyalty
          - interactive-server-manager
          - interactive-server-status
          - interactive-spotify
          - interactive-translate
          - interactive-youtube-music
          - core-labels
          - core-identity
          - core-browser-source
          - core-reputation
          - core-community
          - ai-researcher
          - core-video-proxy
          - core-engagement
          - core-module-rtc
          - core-workflow
          - core-analytics
          - core-credential-manager
          - core-security
          - action-discord
          - action-slack
          - action-twitch
          - action-youtube
          - migrations
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image }}:${{ needs.determine-version.outputs.version }}${{ needs.determine-version.outputs.suffix }}
          format: 'sarif'
          output: 'trivy-${{ matrix.image }}.sarif'
          trivy-version: 'v0.69.3'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.image }}.sarif'

  # Create GitHub Release
  create-release:
    name: Create Pre-Release
    runs-on: ubuntu-latest
    needs: [determine-version, build-core, build-collectors, build-interactions, build-admin, build-actions]
    if: needs.determine-version.outputs.is_release == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"

          # Check if release already exists
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "Release $VERSION already exists, skipping"
            exit 0
          fi

          # Create release notes
          cat << EOF > release_notes.md
          ## Pre-Release $VERSION

          This is an automated pre-release created when the .version file was updated.

          **Container Images Built:**
          - All modules tagged with \`$VERSION\` and \`latest\`
          - Available at \`ghcr.io/${{ github.repository }}\`

          ### Changes

          See commit history for detailed changes since last release.

          ---
          *This pre-release was automatically generated by the CI/CD pipeline.*
          EOF

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file release_notes.md \
            --prerelease \
            --target ${{ github.sha }}

          echo "Created pre-release $VERSION"

  # Notify on completion
  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [determine-version, build-core, build-collectors, build-interactions, build-admin, build-actions, integration-tests, security-scan]
    if: always()
    steps:
      - name: Build Status Summary
        run: |
          echo "## Container Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Core Modules | ${{ needs.build-core.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Collector Modules | ${{ needs.build-collectors.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Interaction Modules | ${{ needs.build-interactions.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Admin Modules | ${{ needs.build-admin.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Action Modules | ${{ needs.build-actions.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
