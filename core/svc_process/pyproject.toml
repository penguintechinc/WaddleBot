[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names are self-documenting (pytest convention); S101 (assert) is
# standard pytest usage; SLF001 (private-member access) is a deliberate
# test-only override of BundlePoller's internal backoff state for a fast
# lifecycle test. S105/S106 flag fixed test-only secret/env-var values
# (e.g. DB_PASS="secret" in test_config.py's DATABASE_URL-building
# coverage), not real credentials -- mirrors `core/svc_action/pyproject.
# toml`'s identical per-file-ignore and reasoning.
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "S101", "S105", "S106", "SLF001"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
exclude = ["^\\.venv/", "^tests/"]

# libs/flask_core ships no py.typed marker -- same boundary override
# hub_api/pyproject.toml uses for the identical reason (see that file's
# own comment).
[[tool.mypy.overrides]]
module = ["flask_core.*"]
ignore_missing_imports = true
follow_imports = "skip"

# libs/moderation_module ships no py.typed marker either -- identical
# boundary override, added for services/moderation_gate.py.
[[tool.mypy.overrides]]
module = ["moderation_module.*"]
ignore_missing_imports = true
follow_imports = "skip"
