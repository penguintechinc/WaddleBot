[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names are self-documenting (pytest convention); S101 is standard
# pytest `assert`; S105/S106 flag fixed test-only secret/env-var names
# (e.g. "TEST_WEBHOOK_SECRET"), not real credentials.
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
exclude = ["^\\.venv/", "^tests/"]

# Same boundary override as hub_api/pyproject.toml: libs/flask_core and
# pydal ship no py.typed marker / stubs -- follow_imports = "skip" so mypy
# treats every imported name as Any rather than analyzing flask_core's own
# untyped source. libs/waddle_transports (the shared transport-primitives
# library, PR #275) is itself --strict clean internally but likewise ships
# no py.typed marker yet -- same treatment here, tracked as a follow-up on
# that package rather than this service's own pyproject.toml. svc-action's
# own code stays --strict throughout.
[[tool.mypy.overrides]]
module = ["flask_core.*", "pydal.*", "fakeredis.*", "waddle_transports.*"]
ignore_missing_imports = true
follow_imports = "skip"
