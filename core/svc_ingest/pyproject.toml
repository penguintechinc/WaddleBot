[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names are self-documenting (pytest convention); S101 (assert) is
# standard pytest usage; SLF001 (private-member access) is a deliberate
# test-only override of BundlePoller's internal backoff state for a fast
# lifecycle test; S105/S106 flag fixed test-only secret/token literals
# (e.g. "wrong-secret", a fake OAuth token string), not real credentials
# -- same rationale as core/svc_action/pyproject.toml's own exemption.
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "S101", "S105", "S106", "SLF001"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
exclude = ["^\\.venv/", "^tests/"]

# libs/flask_core / libs/waddle_transports ship no py.typed marker --
# same boundary override hub_api/pyproject.toml uses for the identical
# reason (see that file's own comment).
[[tool.mypy.overrides]]
module = ["flask_core.*", "waddle_transports.*"]
ignore_missing_imports = true
follow_imports = "skip"

# py-cord ships no inline type stubs / py.typed marker -- follow_imports =
# "skip" (not just ignore_missing_imports) so mypy --strict doesn't also
# flag every call into it as "Call to untyped function", same boundary
# treatment as flask_core.* above.
[[tool.mypy.overrides]]
module = ["discord.*"]
ignore_missing_imports = true
follow_imports = "skip"

# waddle_transports (libs/waddle_transports) ships no py.typed marker
# either -- same boundary treatment.
[[tool.mypy.overrides]]
module = ["waddle_transports.*"]
ignore_missing_imports = true
follow_imports = "skip"
