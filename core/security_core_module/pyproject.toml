[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names are self-documenting (pytest convention); S105/S106/S107 flag
# fixed test-only bearer tokens/service keys (mirroring flask_core's own
# `os.getenv("SECRET_KEY", "change-me-in-production")` default), not real
# credentials. S101 (assert) is standard pytest usage.
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "S101", "S105", "S106", "S107"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
exclude = ["^\\.venv/", "^tests/"]

# libs/flask_core ships no py.typed marker -- same boundary override
# hub_api/pyproject.toml uses for the identical reason.
[[tool.mypy.overrides]]
module = ["flask_core.*", "pydal.*"]
ignore_missing_imports = true
follow_imports = "skip"
