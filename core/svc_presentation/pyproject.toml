[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names are self-documenting (pytest convention); S101 is standard
# pytest usage; S105/S106 flag fixed test-only tokens (e.g. the push-token
# bearer-auth test fixtures), not real credentials.
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
exclude = ["^\\.venv/", "^tests/"]

# flask_core (this monorepo's shared lib) and pydal ship no py.typed
# marker / stubs, and flask_core's tenant_middleware/require_scope-style
# decorators have untyped inner wrappers -- same boundary override
# hub_api/pyproject.toml documents for the identical reason.
[[tool.mypy.overrides]]
module = ["flask_core.*", "pydal.*", "redis.*"]
ignore_missing_imports = true
follow_imports = "skip"
