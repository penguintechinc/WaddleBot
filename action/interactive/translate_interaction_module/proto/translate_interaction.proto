syntax = "proto3";

package translate_interaction;

// Translation service — called by router in the hot message-processing path
service TranslateInteraction {
  // Translate a chat message (primary hot-path call)
  rpc Translate(TranslateRequest) returns (TranslateResponse);

  // Detect language only, without translating
  rpc DetectLanguage(DetectLanguageRequest) returns (DetectLanguageResponse);

  // Trigger cache cleanup (admin/maintenance)
  rpc CleanupCache(CleanupCacheRequest) returns (CleanupCacheResponse);
}

message TranslateRequest {
  string text = 1;
  string target_lang = 2;
  string community_id = 3;
  string platform = 4;      // "twitch", "discord", "slack", etc.
  string channel_id = 5;    // for emote context
  string token = 6;         // JWT auth token
}

message TranslateResponse {
  bool success = 1;
  bool skipped = 2;         // true if translation not needed (already target lang, too short, etc.)
  string skip_reason = 3;   // why skipped (if skipped=true)
  string translated_text = 4;
  string original_text = 5;
  string detected_lang = 6;
  string target_lang = 7;
  float confidence = 8;
  string provider = 9;      // which provider was used
  bool cached = 10;
  int32 tokens_preserved = 11;
  string error = 12;
}

message DetectLanguageRequest {
  string text = 1;
  string token = 2;
}

message DetectLanguageResponse {
  bool success = 1;
  string detected_lang = 2;
  float confidence = 3;
  string error = 4;
}

message CleanupCacheRequest {
  string token = 1;
}

message CleanupCacheResponse {
  bool success = 1;
  string message = 2;
  string error = 3;
}
