syntax = "proto3";

package teams_action;

// Teams Action Service for receiving tasks from processor
service TeamsActionService {
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc SendEphemeral(SendEphemeralRequest) returns (SendEphemeralResponse);
  rpc UpdateMessage(UpdateMessageRequest) returns (UpdateMessageResponse);
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse);
  rpc OpenModal(OpenModalRequest) returns (OpenModalResponse);
}

// Message requests/responses
message SendMessageRequest {
  string community_id = 1;
  string channel_id = 2;
  string text = 3;
  string blocks_json = 4;  // JSON-encoded adaptive cards
  string thread_ts = 5;    // Optional thread/conversation reference
}

message SendMessageResponse {
  bool success = 1;
  string message_id = 2;
  string error = 3;
}

message SendEphemeralRequest {
  string community_id = 1;
  string channel_id = 2;
  string user_id = 3;
  string text = 4;
}

message SendEphemeralResponse {
  bool success = 1;
  string error = 2;
}

message UpdateMessageRequest {
  string community_id = 1;
  string channel_id = 2;
  string ts = 3;
  string text = 4;
  string blocks_json = 5;
}

message UpdateMessageResponse {
  bool success = 1;
  string error = 2;
}

message DeleteMessageRequest {
  string community_id = 1;
  string channel_id = 2;
  string ts = 3;
}

message DeleteMessageResponse {
  bool success = 1;
  string error = 2;
}

// Task module (Teams modal equivalent)
message OpenModalRequest {
  string community_id = 1;
  string trigger_id = 2;
  string view_json = 3;  // JSON-encoded task module view
}

message OpenModalResponse {
  bool success = 1;
  string view_id = 2;
  string error = 3;
}
