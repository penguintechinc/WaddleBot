{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddlebot-spire.fullname" . }}-server
  labels:
    {{- include "waddlebot-spire.labels" . | nindent 4 }}
    component: server
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: grpc
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: health
  selector:
    {{- include "waddlebot-spire.selectorLabels" . | nindent 4 }}
    component: server
{{- end }}
