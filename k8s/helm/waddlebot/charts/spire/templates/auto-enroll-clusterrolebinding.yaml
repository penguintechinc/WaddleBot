{{- if and .Values.enabled .Values.autoEnroll.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "waddlebot-spire.fullname" . }}-auto-enroll
  labels:
    {{- include "waddlebot-spire.labels" . | nindent 4 }}
    component: auto-enroll
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "waddlebot-spire.fullname" . }}-auto-enroll
subjects:
- kind: ServiceAccount
  name: {{ include "waddlebot-spire.fullname" . }}-auto-enroll
  namespace: {{ .Release.Namespace }}
{{- end }}
