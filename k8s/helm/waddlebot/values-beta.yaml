# Waddles Helm Chart - Beta Cluster Values
# This file overrides default values for beta cluster deployment
# Usage: helm upgrade --install waddlebot . -f values.yaml -f values-beta.yaml

# Global settings for beta cluster
global:
  imageRegistry: "registry-dal2.penguintech.io/waddlebot"
  imageTag: "latest"
  imagePullPolicy: Always

# Infrastructure - Enable core services in beta
infrastructure:
  postgresql:
    enabled: true
    image: postgres:16-alpine
    persistence:
      size: 10Gi
      storageClass: "longhorn"
  redis:
    enabled: true
    image: redis:7-alpine
    persistence:
      size: 2Gi
      storageClass: "longhorn"
  minio:
    enabled: false
  ollama:
    enabled: false
  qdrant:
    enabled: false

# Module image overrides - use registry image names
modules:
  # Router
  router:
    image: router
    replicas: 1

  # Hub
  hub:
    image: hub-api
    replicas: 1

  hubWebui:
    image: hub-webui
    replicas: 1

  # Core Modules
  identityCore:
    image: core-identity
    replicas: 1

  labelsCore:
    image: core-labels
    replicas: 1

  browserSource:
    image: core-browser-source
    replicas: 1

  reputation:
    image: core-reputation
    replicas: 1

  community:
    image: core-community
    replicas: 1

  aiResearcher:
    image: ai-researcher

  videoProxy:
    image: core-video-proxy

  engagement:
    image: core-engagement

  moduleRtc:
    image: core-module-rtc
    replicas: 1
    autoscaling:
      minReplicas: 1
      maxReplicas: 1

  # Collectors/Triggers
  collectors:
    twitch:
      image: trigger-twitch
      replicas: 1
    discord:
      image: trigger-discord
      replicas: 1
    slack:
      image: trigger-slack
      replicas: 1
    youtubeLive:
      image: trigger-youtube
    kick:
      image: trigger-kick

  # Interactive Modules
  interactive:
    ai:
      image: interactive-ai
      replicas: 1
    alias:
      image: interactive-alias
      replicas: 1
    shoutout:
      image: interactive-shoutout
      replicas: 1
    inventory:
      image: interactive-inventory
      replicas: 1
    calendar:
      image: interactive-calendar
      replicas: 1
    memories:
      image: interactive-memories
      replicas: 1
    youtubeMusic:
      image: interactive-youtube-music
    spotify:
      image: interactive-spotify
    loyalty:
      image: interactive-loyalty
      replicas: 1
    translate:
      enabled: true
      name: translate-interaction
      image: interactive-translate
      replicas: 1
    lfg:
      image: interactive-lfg
      replicas: 1
    clip:
      image: interactive-clip
      replicas: 1
    serverStatus:
      image: interactive-server-status
      replicas: 1
    serverManager:
      image: interactive-server-manager
      replicas: 1

  # Core - missing modules
  analytics:
    image: core-analytics
    replicas: 1
  security:
    image: core-security
    replicas: 1
  workflow:
    image: core-workflow
    replicas: 1
  credentialManager:
    image: core-credential-manager
    replicas: 1

  # Marketplace Module
  marketplace:
    image: marketplace
    replicas: 1

  # Platform Action Modules
  platformActions:
    discord:
      image: action-discord
      replicas: 1
    slack:
      image: action-slack
      replicas: 1
    twitch:
      image: action-twitch
      replicas: 1
    youtube:
      image: action-youtube

# Shared Environment
sharedEnv:
  DB_HOST: "infra-postgres"
  REDIS_HOST: "infra-redis"
  MINIO_ENDPOINT: "infra-minio:9000"
  QDRANT_HOST: "infra-qdrant"
  ROUTER_URL: "http://waddlebot-router:8000"
  HUB_URL: "http://waddlebot-hub:8060"

# Ingress - using Cloudflare wildcard certificate
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/websocket-services: "waddlebot-hub-api"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: waddlebot.penguintech.cloud
      paths:
        - path: /socket.io
          pathType: Prefix
          service: hub-api
          port: 8060
        - path: /api
          pathType: Prefix
          rawService: kong-proxy
          port: 8080
        - path: /
          pathType: Prefix
          service: hub-webui
          port: 80
        - path: /webhooks/twitch
          pathType: Prefix
          service: twitch-collector
          port: 8002
        - path: /webhooks/discord
          pathType: Prefix
          service: discord-collector
          port: 8003
        - path: /webhooks/slack
          pathType: Prefix
          service: slack-collector
          port: 8004
    - host: waddles.penguintech.cloud
      paths:
        - path: /socket.io
          pathType: Prefix
          service: hub-api
          port: 8060
        - path: /api
          pathType: Prefix
          rawService: kong-proxy
          port: 8080
        - path: /
          pathType: Prefix
          service: hub-webui
          port: 80
        - path: /webhooks/twitch
          pathType: Prefix
          service: twitch-collector
          port: 8002
        - path: /webhooks/discord
          pathType: Prefix
          service: discord-collector
          port: 8003
        - path: /webhooks/slack
          pathType: Prefix
          service: slack-collector
          port: 8004
  tls:
    - secretName: penguintech-cloud-wildcard-tls
      hosts:
        - waddlebot.penguintech.cloud
        - waddles.penguintech.cloud

# Network Policies — enabled in beta for namespace isolation
networkPolicy:
  enabled: true

# Kong API Gateway - explicitly enabled in beta
kong:
  enabled: true
  # Mirror kong:3.9 to private registry — cluster nodes cannot reach Docker Hub
  image:
    repository: registry-dal2.penguintech.io/waddlebot/kong
    tag: "3.9"
  proxy:
    enabled: true
    type: ClusterIP
    http:
      enabled: true
      servicePort: 8080
      containerPort: 8080
    tls:
      enabled: false
