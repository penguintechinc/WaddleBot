# Waddles Helm Chart - Default Values
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings
global:
  # Container registry for Waddles images
  # For GitHub Container Registry: ghcr.io/owner/repo
  # For Docker Hub: docker.io/waddlebot
  # For local registry: localhost:32000/waddlebot
  imageRegistry: "docker.io/waddlebot"

  # Image tag to deploy (e.g., "latest", commit SHA, or version tag)
  imageTag: "latest"

  # Image pull policy
  imagePullPolicy: IfNotPresent

  # Secrets for pulling from private registries (if needed)
  imagePullSecrets: []

  # Default storage class for persistent volumes
  storageClass: "standard"

  # OVERRIDE REQUIRED: override via --set or values override file
  # Security secrets (set via kubectl create secret or values override)
  # Defaults match docker-compose.yml for local development consistency
  jwtSecret: "REPLACE_ME_jwt_secret"
  moduleSecretKey: "REPLACE_ME_module_secret"
  serviceApiKey: "REPLACE_ME_service_key"

  # Logging
  logLevel: "INFO"
  nodeEnv: "production"

# Namespace configuration
namespace: waddlebot
namespaceCreate: true  # Create namespace if it doesn't exist

# Service Account
serviceAccount:
  create: true
  name: "waddlebot"
  annotations: {}

# Resource presets
resourcePresets:
  small:
    cpu: "100m"
    memory: "128Mi"
    cpuLimit: "500m"
    memoryLimit: "512Mi"
  medium:
    cpu: "250m"
    memory: "256Mi"
    cpuLimit: "1000m"
    memoryLimit: "1Gi"
  large:
    cpu: "500m"
    memory: "512Mi"
    cpuLimit: "2000m"
    memoryLimit: "2Gi"

# Infrastructure Services
infrastructure:
  # PostgreSQL Database
  postgresql:
    enabled: true
    username: "waddlebot"
    database: "waddlebot"
    password: "REPLACE_ME"  # Only used for secrets, actual DB already running
    image: postgres:16-bookworm@sha256:a0fd72825431f4b7fd3f9d5def9f370b9c22012f1a9e37ece1a5749b95333fb7
    service:
      name: "infra-postgres"
      port: 5432
      type: ClusterIP
    port: 5432
    replicas: 1
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2000m"
        memory: "2Gi"
    persistence:
      enabled: true
      name: "postgres-data"
      size: 20Gi
      accessMode: ReadWriteOnce
      storageClass: ""
    env:
      POSTGRES_DB: waddlebot
      POSTGRES_USER: waddlebot
      # POSTGRES_PASSWORD should be set via secrets
    readReplicas:
      enabled: false
      count: 2

  # Redis Cache & Sessions
  redis:
    enabled: true
    image: redis:7-bookworm@sha256:33d7c9a245edd95e6703a0addbeaa48fe40c3b3b4783627a72085155462ebfdb  # Use Debian instead of Alpine for compatibility
    port: 6379
    password: "REPLACE_ME"  # Only used for secrets, actual Redis already running
    # Module-specific Redis passwords (matches docker-compose.yml ACL setup)
    modulePasswords:
      admin: "REPLACE_ME"
      router: "REPLACE_ME"
      hub: "REPLACE_ME"
      workflow: "REPLACE_ME"
      ai: "REPLACE_ME"
      analytics: "REPLACE_ME"
      security: "REPLACE_ME"
      loyalty: "REPLACE_ME"
      spotify: "REPLACE_ME"
      ytmusic: "REPLACE_ME"
      twitch: "REPLACE_ME"
      discord: "REPLACE_ME"
      slack: "REPLACE_ME"
    maxMemory: "256mb"
    maxMemoryPolicy: "allkeys-lru"
    service:
      name: "infra-redis"
      port: 6379
      type: ClusterIP
    replicas: 1
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    persistence:
      enabled: true
      name: "redis-data"
      size: 5Gi
      accessMode: ReadWriteOnce
      storageClass: ""

  # MinIO Object Storage
  minio:
    enabled: true
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    apiPort: 9000
    consolePort: 9001
    bucketName: "waddlebot-assets"
    # Default credentials (matches docker-compose.yml)
    rootUser: "REPLACE_ME"
    rootPassword: "REPLACE_ME"
    service:
      name: "infra-minio"
      apiPort: 9000
      consolePort: 9001
    replicas: 1
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
    persistence:
      enabled: true
      size: 50Gi
    env:
      MINIO_BROWSER: "on"

  # Ollama AI Backend
  ollama:
    enabled: true
    image: ollama/ollama:latest@sha256:bfc9c6d53cc6989aa5131a6fde6b162b2802d4d337657f3253b5f69579bddeee
    port: 11434
    defaultProvider: "ollama"
    defaultModel: "tinyllama"
    service:
      name: "ai-ollama"
      port: 11434
    replicas: 1
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2000m"
        memory: "2Gi"
    persistence:
      enabled: true
      size: 30Gi
    gpu:
      enabled: false
      count: 1

  # Qdrant Vector Database
  qdrant:
    enabled: true
    image: qdrant/qdrant:latest@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c
    port: 6333
    grpcPort: 6334
    service:
      name: "infra-qdrant"
      port: 6333
    replicas: 1
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
    persistence:
      enabled: true
      size: 10Gi

  # Apache OpenWhisk (Serverless)
  openwhisk:
    enabled: false
    # OpenWhisk requires complex setup - typically deployed separately
    apiHost: ""
    apiKey: ""

# Processing Module
modules:
  # Processing Module - Router (UNCHANGED)
  router:
    enabled: true
    name: router
    image: waddlebot-router
    imageTag: ""
    port: 8000
    service:
