{{- if .Values.modules.platformActions.teams.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waddlebot.fullname" . }}-teams-action
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: teams-action
spec:
  replicas: {{ .Values.modules.platformActions.teams.replicas }}
  selector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: teams-action
  template:
    metadata:
      labels:
        {{- include "waddlebot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: teams-action
    spec:
      serviceAccountName: {{ include "waddlebot.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      initContainers:
      {{- include "waddlebot.dbMigrateInitContainer" . | nindent 6 }}
      containers:
      - name: teams-action
        image: "{{ .Values.global.imageRegistry }}/{{ .Values.modules.platformActions.teams.image }}:{{ .Values.modules.platformActions.teams.imageTag | default .Values.global.imageTag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        ports:
        - name: rest
          containerPort: 8074
          protocol: TCP
        - name: grpc
          containerPort: 50057
          protocol: TCP
        envFrom:
        - configMapRef:
            name: {{ include "waddlebot.fullname" . }}-config
        - configMapRef:
            name: {{ include "waddlebot.fullname" . }}-teams-action-config
            optional: true
        - secretRef:
            name: {{ include "waddlebot.fullname" . }}-secrets
        - secretRef:
            name: {{ include "waddlebot.fullname" . }}-teams-action-secret
            optional: true
        env:
        - name: MODULE_NAME
          value: "teams-action"
        - name: MODULE_PORT
          value: "8074"
        - name: GRPC_PORT
          value: "50057"
        - name: TEAMS_APP_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-teams-action-secret
              key: teams-app-id
              optional: true
        - name: TEAMS_APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-teams-action-secret
              key: teams-app-password
              optional: true
        - name: TEAMS_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "waddlebot.fullname" . }}-teams-action-secret
              key: teams-tenant-id
              optional: true
        livenessProbe:
          httpGet:
            path: /health
            port: rest
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: rest
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.modules.platformActions.teams.resources | nindent 10 }}
        volumeMounts:
        - name: logs
          mountPath: /var/log/waddlebotlog
      volumes:
      - name: logs
        emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddlebot.fullname" . }}-teams-action
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: teams-action
spec:
  type: ClusterIP
  ports:
  - port: 8074
    targetPort: rest
    protocol: TCP
    name: rest
  - port: 50057
    targetPort: grpc
    protocol: TCP
    name: grpc
  selector:
    {{- include "waddlebot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: teams-action
{{- end }}
