{{- if and .Values.kong.enabled .Values.infrastructure.postgresql.enabled }}
---
# Kong database provisioning hook
# Runs before Kong's own pre-upgrade-migrations job so the kong user/db always exists.
apiVersion: batch/v1
kind: Job
metadata:
  name: kong-db-provision
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: kong-db-provision
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kong-db-provision
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      containers:
      - name: kong-db-provision
        image: {{ .Values.infrastructure.postgresql.image }}
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Provisioning Kong database..."
          PGCONN="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@{{ .Values.infrastructure.postgresql.service.name }}:{{ .Values.infrastructure.postgresql.service.port }}/postgres"

          # Create kong user (idempotent)
          psql "$PGCONN" -tc "SELECT 1 FROM pg_roles WHERE rolname='${KONG_PG_USER}'" | grep -q 1 || \
            psql "$PGCONN" -c "CREATE USER \"${KONG_PG_USER}\" WITH PASSWORD '${KONG_PG_PASSWORD}';"

          # Create kong database (idempotent)
          psql "$PGCONN" -tc "SELECT 1 FROM pg_database WHERE datname='${KONG_PG_DATABASE}'" | grep -q 1 || \
            psql "$PGCONN" -c "CREATE DATABASE \"${KONG_PG_DATABASE}\" OWNER \"${KONG_PG_USER}\";"

          # Ensure privileges
          psql "$PGCONN" -c "GRANT ALL PRIVILEGES ON DATABASE \"${KONG_PG_DATABASE}\" TO \"${KONG_PG_USER}\";"

          echo "Kong database provisioning complete."
        env:
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: waddlebot-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: waddlebot-secrets
              key: POSTGRES_PASSWORD
        - name: KONG_PG_USER
          valueFrom:
            configMapKeyRef:
              name: waddlebot-config
              key: KONG_PG_USER
        - name: KONG_PG_DATABASE
          valueFrom:
            configMapKeyRef:
              name: waddlebot-config
              key: KONG_PG_DATABASE
        - name: KONG_PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: waddlebot-secrets
              key: KONG_PG_PASSWORD
{{- end }}
