# Static gRPC TLS cert Secret -- the default path (global.grpcTls.certManager.enabled=false).
# Mounted by every gRPC server/client Deployment at /etc/waddlebot/grpc-tls (see
# _helpers.tpl's waddlebot.grpcTls* helpers). Key names (ca.crt/tls.crt/tls.key) match
# cert-manager's own fixed Secret output so both paths are interchangeable to every
# Deployment without it knowing which one populated the Secret -- one identity cert
# (server auth + client auth) serves both roles.
#
# NEVER a literal cert/key in git for beta/gamma/production -- these values.yaml keys ship
# empty; populate the real PEM material via `helm upgrade --set-file global.grpcTls.ca.crt=...
# --set-file global.grpcTls.tls.crt=... --set-file global.grpcTls.tls.key=...` (or overwrite
# this Secret out-of-band via ExternalSecrets/SealedSecrets) before deploying anywhere beyond
# alpha. Alpha instead sets global.grpcTls.insecureDev=true and never needs this Secret
# populated -- see scripts/setup/generate_dev_grpc_certs.sh for the equivalent docker-compose
# dev CA if a real alpha cert bundle is ever wanted.
#
# When global.grpcTls.certManager.enabled=true, cert-manager (templates/
# grpc-tls-certificate.yaml) owns this exact Secret name instead and this template no-ops
# to avoid a competing owner for the same object.
{{- if not .Values.global.grpcTls.certManager.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "waddlebot.fullname" . }}-grpc-tls
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: grpc-tls
type: Opaque
stringData:
  ca.crt: {{ .Values.global.grpcTls.ca.crt | quote }}
  tls.crt: {{ .Values.global.grpcTls.tls.crt | quote }}
  tls.key: {{ .Values.global.grpcTls.tls.key | quote }}
{{- end }}
