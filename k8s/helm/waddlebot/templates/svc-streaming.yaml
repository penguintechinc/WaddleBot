# v3.0.x — SCAFFOLD ONLY. Streaming module's control plane (RTC + broadcast media). See
# docs/plans/2026-08-31-svc-streaming-design.md — the load-bearing correction at the top of
# that doc: there is NO first-party media engine in this repo. This container is a CONTROL
# PLANE fronting two EXTERNAL media engines (MarchProxy for RTMP/AV1 transcode,
# core/video_proxy_module/config.py:39-40; LiveKit for the SFU, core/module_rtc/go.mod:8-11)
# — build-vs-keep-external is an OPEN decision (spec §8.1), not settled by this scaffold.
#
# Only the control REST/gRPC ports are declared here — media transport (RTMP 1935, WebRTC/SFU
# UDP) is §7.1 "only if §8.1 = build" and is explicitly NOT wired: no privileged port, no
# hostNetwork/hostPort, no NET_ADMIN/NET_RAW capability added. Any of those needs an explicit
# user-approved `# ROOT EXCEPTION (approved)` per critical-rules.md Rootless Containers —
# TODO, not assumed here.
#
# Gated solely on `pipeline.svcStreaming.enabled`, same single-condition gate as
# svc-presentation.yaml — NOT on a `modules.streaming.enabled` toggle. The spec's target state
# (§6) gates the *absorbed* container on `modules.streaming.enabled`, but that module doesn't
# exist in `modules.*` yet (today: bot/social/customer/marketing) and adding it is out of
# scope for this scaffold PR. svc-rtc.yaml / video_proxy_module are UNTOUCHED — this is a new,
# additional container, not a replacement (spec §6's absorption is deferred, not done here).
#
# Base image pinned to the same digest already used by every other pipeline-stage skeleton in
# this file (pipeline.pythonBaseImage) — no Dockerfile/CI image exists for svc-streaming yet;
# core/svc_streaming/Dockerfile in this PR is scaffold-only, not wired into CI. Note the design
# spec targets Rust for the eventual control plane (§1) — this scaffold is Python/Quart to
# match the svc-presentation pattern this PR was asked to mirror; the Rust rewrite is follow-up
# work, not contradicted by this placeholder.
{{- if .Values.pipeline.svcStreaming.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-streaming
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-streaming
spec:
  replicas: {{ .Values.pipeline.svcStreaming.replicas }}
  selector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: svc-streaming
  template:
    metadata:
      labels:
        {{- include "waddlebot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: svc-streaming
    spec:
      serviceAccountName: {{ include "waddlebot.serviceAccountName" . }}
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: svc-streaming
        # SKELETON PLACEHOLDER — no Dockerfile/CI image exists yet for svc-streaming; pinned
        # to the repo's existing Python base digest rather than inventing one or using a
        # mutable tag. Replace once svc-streaming has its own CI build (and, per spec §1,
        # once/if the service is rewritten in Rust).
        image: "{{ .Values.pipeline.pythonBaseImage }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        ports:
        - name: http
          containerPort: {{ .Values.pipeline.svcStreaming.port }}
          protocol: TCP
        - name: grpc
          containerPort: {{ .Values.pipeline.svcStreaming.grpcPort }}
          protocol: TCP
        envFrom:
        - configMapRef:
            name: {{ include "waddlebot.fullname" . }}-config
        - secretRef:
            name: {{ include "waddlebot.fullname" . }}-secrets
        env:
        - name: MODULE_NAME
          value: "svc-streaming"
        - name: PIPELINE_STAGE
          value: "streaming"
        - name: MODULE_PORT
          value: {{ .Values.pipeline.svcStreaming.port | quote }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.pipeline.svcStreaming.resources | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-streaming
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-streaming
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.pipeline.svcStreaming.port }}
    targetPort: http
    protocol: TCP
    name: http
  - port: {{ .Values.pipeline.svcStreaming.grpcPort }}
    targetPort: grpc
    protocol: TCP
    name: grpc
  selector:
    {{- include "waddlebot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: svc-streaming
{{- end }}
