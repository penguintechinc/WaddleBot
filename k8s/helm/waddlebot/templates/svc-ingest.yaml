# v3.0.x Task 0.5 — SKELETON. Pipeline stage 1/3: platform receivers + inbound webhooks.
# Folds collectors/{discord,googlechat,kick,mattermost,slack,teams,twitch,youtube-live}.yaml
# and pushing/{trigger-webhooks,trigger-streaming}.yaml — see PIPELINE_MAPPING.md for the
# full 31→7 mapping. Coexists with those 10 legacy Deployments; cutover is a later task.
#
# Module bundle gating: presence of MODULE_LOAD_* env vars signals which Module App bundles
# this stage should import. The actual conditional Python import behind these env vars is
# the remaining build — this skeleton only proves the values flag reaches the container.
#
# 8-container decision (folded in from a briefly-standalone svc-gateway 9th container):
# this same Deployment ALSO runs svc-ingest's socket-owning receivers (Discord gateway
# today, `core/svc_ingest/receivers/discord_gateway.py`) as `supervisor.ReceiverSupervisor`-
# supervised tasks alongside the poll-drain loop. No new env var wiring needed here --
# `DISCORD_BOT_TOKEN` is already in the shared `-secrets` Secret (`secrets.yaml`) and
# already reaches this container via the `envFrom: secretRef` below; the receiver/
# socket-lease tuning knobs (`RECEIVER_BASE_BACKOFF_S`/`SOCKET_LEASE_TTL_S`/etc.) fall back
# to `config.py`'s own sane defaults the same way `POLL_INTERVAL_S`/`BASE_BACKOFF_S` already
# do for the poll-drain loop -- not Helm-overridden today. Each replica races to CLAIM the
# `waddles:socket-owner:discord:_platform` Valkey lease (`socket_lease.py`) at startup, so
# `replicas: 2` below is already safe -- only one replica ever actually holds the socket.
# KNOWN GAP (pre-existing, not introduced by this change): this Deployment has no
# `VALKEY_URL` env var wired at all (only legacy `REDIS_HOST`/`REDIS_PORT` exist in the
# shared configmap) -- `Config.VALKEY_URL` falls back to `redis://localhost:6379/0`, which
# is wrong for a real cluster deploy. Wiring a real `VALKEY_URL` is out of scope here
# (pre-dates this PR, affects the poll-drain loop identically) -- flagged for follow-up.
{{- if .Values.pipeline.svcIngest.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-ingest
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-ingest
spec:
  replicas: {{ .Values.pipeline.svcIngest.replicas }}
  selector:
    matchLabels:
      {{- include "waddlebot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: svc-ingest
  template:
    metadata:
      labels:
        {{- include "waddlebot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: svc-ingest
    spec:
      serviceAccountName: {{ include "waddlebot.serviceAccountName" . }}
      {{- include "waddlebot.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
      {{- include "waddlebot.dbMigrateInitContainer" . | nindent 6 }}
      containers:
      - name: svc-ingest
        # SKELETON PLACEHOLDER — no Dockerfile/CI image exists yet for svc-ingest; pinned to
        # the repo's existing Python base digest rather than inventing one or using a mutable
        # tag. Replace once svc-ingest has its own Dockerfile and CI build.
        image: "{{ .Values.pipeline.pythonBaseImage }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        ports:
        - name: http
          containerPort: {{ .Values.pipeline.svcIngest.port }}
          protocol: TCP
        envFrom:
        - configMapRef:
            name: {{ include "waddlebot.fullname" . }}-config
        - secretRef:
            name: {{ include "waddlebot.fullname" . }}-secrets
        env:
        - name: MODULE_NAME
          value: "svc-ingest"
        - name: PIPELINE_STAGE
          value: "ingest"
        - name: MODULE_PORT
          value: {{ .Values.pipeline.svcIngest.port | quote }}
        {{- if .Values.modules.bot.enabled }}
        - name: MODULE_LOAD_BOT
          value: "true"
        {{- end }}
        {{- if .Values.modules.social.enabled }}
        - name: MODULE_LOAD_SOCIAL
          value: "true"
        {{- end }}
        {{- if .Values.modules.marketing.enabled }}
        - name: MODULE_LOAD_MARKETING
          value: "true"
        {{- end }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.pipeline.svcIngest.resources | nindent 10 }}
        volumeMounts:
        - name: logs
          mountPath: /var/log/waddlebotlog
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: logs
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddlebot.fullname" . }}-svc-ingest
  labels:
    {{- include "waddlebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: svc-ingest
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.pipeline.svcIngest.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "waddlebot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: svc-ingest
{{- end }}
