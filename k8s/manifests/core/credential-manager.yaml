apiVersion: apps/v1
kind: Deployment
metadata:
  name: credential-manager
  namespace: waddlebot
  labels:
    app.kubernetes.io/name: credential-manager
    app.kubernetes.io/component: core
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: credential-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: credential-manager
        app.kubernetes.io/component: core
    spec:
      containers:
      - name: credential-manager
        image: registry-dal2.penguintech.io/waddlebot/credential_manager_module:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8095
          protocol: TCP
        env:
        - name: MODULE_NAME
          value: "credential-manager"
        - name: MODULE_PORT
          value: "8095"
        - name: DATABASE_URL
          value: "postgresql://waddlebot:changeme@infra-postgres:5432/waddlebot"
        - name: REDIS_URL
          value: "redis://hub:changeme@infra-redis:6379/0"
        - name: REDIS_KEY_PREFIX
          value: "credentials:"
        - name: TOKEN_REFRESH_BUFFER
          value: "300"
        - name: POLL_INTERVAL
          value: "60"
        - name: SECRETS_BACKEND
          value: "kubernetes"
        - name: SECRETS_PATH
          value: "/secrets/db-passwords"
        livenessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: logs
          mountPath: /var/log/waddlebotlog
      volumes:
      - name: logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: credential-manager-service
  namespace: waddlebot
  labels:
    app.kubernetes.io/name: credential-manager
    app.kubernetes.io/component: core
spec:
  type: ClusterIP
  ports:
  - port: 8095
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: credential-manager
