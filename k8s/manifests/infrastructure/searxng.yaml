---
# SearXNG ConfigMap — mounts settings.yml into the container
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: waddlebot
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/instance: waddlebot
    app.kubernetes.io/component: metasearch
data:
  settings.yml: |
    general:
      instance_name: "waddlebot-searxng"
      debug: false
      privacypolicy_url: false
      contact_url: false
    search:
      safe_search: 0
      autocomplete: ""
      default_lang: "en"
      formats:
        - json
    server:
      port: 8888
      bind_address: "0.0.0.0"
      secret_key: "waddlebot-searxng-internal-key"
      limiter: false
      image_proxy: false
      method: "GET"
    ui:
      static_use_hash: true
    outgoing:
      request_timeout: 10
      max_request_timeout: 15
      useragent_suffix: ""
      pool_connections: 50
      pool_maxsize: 20
    engines:
      - name: google
        engine: google
        shortcut: g
        disabled: false
      - name: duckduckgo
        engine: duckduckgo
        shortcut: ddg
        disabled: false
      - name: bing
        engine: bing
        shortcut: bi
        disabled: false
      - name: brave
        engine: brave
        shortcut: br
        disabled: false
      - name: wikipedia
        engine: wikipedia
        shortcut: wp
        disabled: false
      - name: wikidata
        engine: wikidata
        shortcut: wd
        disabled: false
      - name: reddit
        engine: reddit
        shortcut: re
        disabled: true
      - name: twitter
        engine: twitter
        shortcut: tw
        disabled: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: waddlebot
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/instance: waddlebot
    app.kubernetes.io/component: metasearch
    app.kubernetes.io/version: "latest"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
      app.kubernetes.io/instance: waddlebot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
        app.kubernetes.io/instance: waddlebot
        app.kubernetes.io/component: metasearch
        app.kubernetes.io/version: "latest"
    spec:
      containers:
      - name: searxng
        image: searxng/searxng:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8888
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: searxng-settings
          mountPath: /etc/searxng/settings.yml
          subPath: settings.yml
          readOnly: true
      volumes:
      - name: searxng-settings
        configMap:
          name: searxng-config
---
apiVersion: v1
kind: Service
metadata:
  name: searxng-service
  namespace: waddlebot
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/instance: waddlebot
    app.kubernetes.io/component: metasearch
spec:
  type: ClusterIP
  ports:
  - port: 8888
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/instance: waddlebot
