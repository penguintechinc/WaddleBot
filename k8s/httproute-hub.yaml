apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: waddlebot-hub
  namespace: waddlebot
spec:
  parentRefs:
    - name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - "waddlebot.penguintech.cloud"
    - "waddles.penguintech.cloud"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /socket.io
      timeouts:
        request: 3600s
        backendRequest: 3600s
      backendRefs:
        - name: waddlebot-hub-api
          port: 8060
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/public
      timeouts:
        request: 3600s
        backendRequest: 3600s
      backendRefs:
        - name: waddlebot-hub-api
          port: 8060
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/auth
      timeouts:
        request: 3600s
        backendRequest: 3600s
      backendRefs:
        - name: waddlebot-hub-api
          port: 8060
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/user
      timeouts:
        request: 3600s
        backendRequest: 3600s
      backendRefs:
        - name: waddlebot-hub-api
          port: 8060
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/community
      timeouts:
        request: 3600s
        backendRequest: 3600s
      backendRefs:
        - name: waddlebot-hub-api
          port: 8060
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/communities
      timeouts:
        request: 3600s
        backendRequest: 3600s
      backendRefs:
        - name: waddlebot-hub-api
          port: 8060
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/admin
      timeouts:
        request: 3600s
        backendRequest: 3600s
      backendRefs:
        - name: waddlebot-hub-api
          port: 8060
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/platform
      timeouts:
        request: 3600s
        backendRequest: 3600s
      backendRefs:
        - name: waddlebot-hub-api
          port: 8060
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/superadmin
      timeouts:
        request: 3600s
        backendRequest: 3600s
      backendRefs:
        - name: waddlebot-hub-api
          port: 8060
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/cookie
      timeouts:
        request: 3600s
        backendRequest: 3600s
      backendRefs:
        - name: waddlebot-hub-api
          port: 8060
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/signup-settings
      timeouts:
        request: 3600s
        backendRequest: 3600s
      backendRefs:
        - name: waddlebot-hub-api
          port: 8060
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/internal
      timeouts:
        request: 3600s
        backendRequest: 3600s
      backendRefs:
        - name: waddlebot-hub-api
          port: 8060
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/router
      backendRefs:
        - name: waddlebot-router
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/identity
      backendRefs:
        - name: waddlebot-core-identity
          port: 8050
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/community-core
      backendRefs:
        - name: waddlebot-core-community
          port: 8020
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/ai
      backendRefs:
        - name: waddlebot-interactive-ai
          port: 8005
