apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: waddlebot-misc
  namespace: waddlebot
spec:
  parentRefs:
    - name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - "waddlebot.penguintech.cloud"
    - "waddles.penguintech.cloud"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/marketplace
      timeouts:
        request: 3600s
        backendRequest: 3600s
      backendRefs:
        - name: waddlebot-hub-api
          port: 8060
    - matches:
        - path:
            type: PathPrefix
            value: /webhooks/twitch
      backendRefs:
        - name: waddlebot-twitch-collector
          port: 8002
    - matches:
        - path:
            type: PathPrefix
            value: /webhooks/discord
      backendRefs:
        - name: waddlebot-discord-collector
          port: 8003
    - matches:
        - path:
            type: PathPrefix
            value: /webhooks/slack
      backendRefs:
        - name: waddlebot-slack-collector
          port: 8004
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: waddlebot-hub-webui
          port: 80
