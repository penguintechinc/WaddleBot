apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: waddlebot
namePrefix: alpha-

resources:
  - ../../base

components:
  - ../../components/infrastructure

images:
  # Core Services — use locally built images (waddlebot/{service}:alpha)
  - name: hub-api
    newName: waddlebot/hub-api
    newTag: alpha
  - name: hub-webui
    newName: waddlebot/hub-webui
    newTag: alpha
  - name: core-router
    newName: waddlebot/core-router
    newTag: alpha
  - name: core-identity
    newName: waddlebot/core-identity
    newTag: alpha
  - name: core-labels
    newName: waddlebot/core-labels
    newTag: alpha
  - name: core-browser-source
    newName: waddlebot/core-browser-source
    newTag: alpha
  - name: core-reputation
    newName: waddlebot/core-reputation
    newTag: alpha
  - name: core-community
    newName: waddlebot/core-community
    newTag: alpha
  - name: core-ai-researcher
    newName: waddlebot/core-ai-researcher
    newTag: alpha
  - name: core-video-proxy
    newName: waddlebot/core-video-proxy
    newTag: alpha
  - name: core-engagement
    newName: waddlebot/core-engagement
    newTag: alpha
  - name: core-module-rtc
    newName: waddlebot/core-module-rtc
    newTag: alpha

  # Collectors
  - name: collector-twitch
    newName: waddlebot/collector-twitch
    newTag: alpha
  - name: collector-discord
    newName: waddlebot/collector-discord
    newTag: alpha
  - name: collector-slack
    newName: waddlebot/collector-slack
    newTag: alpha
  - name: collector-youtube-live
    newName: waddlebot/collector-youtube-live
    newTag: alpha
  - name: collector-kick
    newName: waddlebot/collector-kick
    newTag: alpha

  # Interactive Modules
  - name: interactive-ai
    newName: waddlebot/interactive-ai
    newTag: alpha
  - name: interactive-alias
    newName: waddlebot/interactive-alias
    newTag: alpha
  - name: interactive-shoutout
    newName: waddlebot/interactive-shoutout
    newTag: alpha
  - name: interactive-inventory
    newName: waddlebot/interactive-inventory
    newTag: alpha
  - name: interactive-calendar
    newName: waddlebot/interactive-calendar
    newTag: alpha
  - name: interactive-memories
    newName: waddlebot/interactive-memories
    newTag: alpha
  - name: interactive-youtube-music
    newName: waddlebot/interactive-youtube-music
    newTag: alpha
  - name: interactive-spotify
    newName: waddlebot/interactive-spotify
    newTag: alpha
  - name: interactive-loyalty
    newName: waddlebot/interactive-loyalty
    newTag: alpha

  # Action/Pushing Services
  - name: action-discord
    newName: waddlebot/action-discord
    newTag: alpha
  - name: action-slack
    newName: waddlebot/action-slack
    newTag: alpha
  - name: action-twitch
    newName: waddlebot/action-twitch
    newTag: alpha
  - name: action-youtube
    newName: waddlebot/action-youtube
    newTag: alpha

  # Infrastructure Services — use upstream images directly
  - name: infra-postgres
    newName: postgres
    newTag: "15"
  - name: infra-redis
    newName: redis
    newTag: 7-alpine
  - name: infra-minio
    newName: minio/minio
    newTag: latest
  - name: infra-qdrant
    newName: qdrant/qdrant
    newTag: latest
  - name: infra-ollama
    newName: ollama/ollama
    newTag: latest

  # Migrations
  - name: waddlebot-migrations
    newName: waddlebot/waddlebot-migrations
    newTag: alpha

labels:
  - pairs:
      environment: alpha
    includeSelectors: false

patches:
  # Set all deployments to single replica for alpha environment
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment

  # Set imagePullPolicy to IfNotPresent for locally imported images.
  # Each deployment has exactly one main container at index 0 and
  # one init container (db-migrate) at index 0.
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
    target:
      kind: Deployment
  # Init containers (db-migrate) — target only deployments that have them.
  # Exclude: hub-webui and infra-* (they have no init containers).
  # Using label selector on app.kubernetes.io/component to match app deployments.
  - patch: |-
      - op: replace
        path: /spec/template/spec/initContainers/0/imagePullPolicy
        value: IfNotPresent
    target:
      kind: Deployment
      labelSelector: "app.kubernetes.io/component notin (hub-webui,storage,ai-runtime,database,vector-db,cache)"

  # Fix service hostnames — Kustomize namePrefix adds "alpha-" to service
  # names but not to ConfigMap values that reference them.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: waddlebot-config
      data:
        DATABASE_HOST: alpha-infra-postgres
        READ_REPLICA_HOST: alpha-infra-postgres
        REDIS_HOST: alpha-infra-redis
        MINIO_ENDPOINT: alpha-infra-minio:9000
        QDRANT_HOST: alpha-infra-qdrant
        OLLAMA_HOST: alpha-ai-ollama
        HUB_HOST: alpha-hub-api
        ROUTER_HOST: alpha-core-router
        TRANSLATE_GRPC_HOST: alpha-interactive-translate:50033
        TRANSLATE_API_URL: http://alpha-interactive-translate:8033
        QDRANT_URL: http://alpha-infra-qdrant:6333
        DATABASE_URL: postgresql://waddlebot:changeme@alpha-infra-postgres:5432/waddlebot

  # Inject waddlebot-config ConfigMap into main app containers so DATABASE_URL
  # and other config values reach the Python services.
  # The base manifests only mount the configmap in init containers (db-migrate);
  # the main container envFrom only has the secretRef. Without this patch,
  # DATABASE_URL is absent and PyDAL falls back to localhost:5432.
  # Excludes hub-webui (nginx) and infra workloads (they don't use this config).
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          configMapRef:
            name: waddlebot-config
    target:
      kind: Deployment
      labelSelector: "app.kubernetes.io/component notin (hub-webui,storage,ai-runtime,database,vector-db,cache)"

  # Configure ingress for alpha environment.
  # Note: Kustomize's namePrefix transformer auto-updates ingress backend
  # service references, so most paths (hub-webui, hub-api, collectors, etc.)
  # are already prefixed correctly. We only need to set host/TLS and fix
  # core-module-rtc which the transformer misses (service name differs in base).
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: waddles.localhost.local
      - op: replace
        path: /spec/tls
        value:
          - hosts:
              - waddles.localhost.local
            secretName: waddlebot-tls
      - op: replace
        path: /spec/rules/0/http/paths/4/backend/service/name
        value: alpha-module-rtc
    target:
      kind: Ingress
      name: waddlebot-ingress

configMapGenerator:
  - name: alpha-environment
    behavior: create
    literals:
      - LOG_LEVEL=DEBUG
      - RELEASE_MODE=false

# Propagate namePrefix into env var values that reference services.
# Kustomize namePrefix only updates resource metadata, not env var values.
