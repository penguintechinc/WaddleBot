apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: waddlebot

resources:
  # Shared resources
  - namespace.yaml
  - serviceaccount.yaml
  - secrets.yaml
  - configmap.yaml
  - ingress.yaml

  # Core services
  - core/hub-api.yaml
  - core/hub-webui.yaml
  - core/router.yaml
  - core/ai-researcher.yaml

  # Consolidated core data service (replaces analytics-core, engagement, reputation, labels-core)
  - core/core-data.yaml

  # Consolidated core identity service (replaces identity-core, security-core, credential-manager)
  - core/core-identity.yaml

  # Consolidated core community service (replaces community, workflow-core, browser-source, video-proxy, module-rtc)
  - core/core-community.yaml

  # Collectors
  - collectors/twitch.yaml
  - collectors/discord.yaml

  # Consolidated trigger webhooks service (replaces collector-slack, collector-teams, collector-mattermost, collector-googlechat)
  - collectors/trigger-webhooks.yaml

  # Consolidated trigger streaming service (replaces collector-twitch, collector-youtube-live, collector-kick)
  - collectors/trigger-streaming.yaml

  # Interactive modules
  - interactive/ai.yaml
  - interactive/loyalty.yaml
  - interactive/translate.yaml

  # Consolidated interactive social service (replaces alias-interaction, shoutout-interaction, presence, quote-interaction)
  - interactive/interactive-social.yaml

  # Consolidated interactive gaming service (replaces lfg-interaction, inventory-interaction, server-manager-interaction, server-status-interaction)
  - interactive/interactive-gaming.yaml

  # Consolidated interactive media service (replaces clip-interaction, spotify-interaction, youtube-music-interaction)
  - interactive/interactive-media.yaml

  # Consolidated interactive productivity service (replaces calendar-interaction, memories-interaction, translate-interaction)
  - interactive/interactive-productivity.yaml

  # Pushing/Action modules
  - pushing/discord-action.yaml

  # Consolidated action platforms service (replaces action-slack, action-teams, action-mattermost, action-googlechat, action-twitch, action-youtube)
  - pushing/action-platforms.yaml

  # Consolidated action serverless service (replaces action-lambda, action-openwhisk, action-gcp-functions)
  - pushing/action-serverless.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: waddlebot
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: true
