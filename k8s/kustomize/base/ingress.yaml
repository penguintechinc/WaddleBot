---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: waddlebot-ingress
  labels:
    app: waddlebot
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/websocket-services: "core-module-rtc"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      # Hub WebUI - Main UI
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hub-webui
            port:
              number: 80
      # Hub API
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: hub-api
            port:
              number: 8060
      # Browser Source - OBS Overlays
      - path: /overlay
        pathType: Prefix
        backend:
          service:
            name: core-browser-source
            port:
              number: 8027
      # Router API
      - path: /router
        pathType: Prefix
        backend:
          service:
            name: core-router
            port:
              number: 8000
      # WebSocket - RTC
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: core-module-rtc
            port:
              number: 8093
      # Webhooks for collectors
      - path: /webhooks/twitch
        pathType: Prefix
        backend:
          service:
            name: collector-twitch
            port:
              number: 8002
      - path: /webhooks/discord
        pathType: Prefix
        backend:
          service:
            name: collector-discord
            port:
              number: 8003
      - path: /webhooks/slack
        pathType: Prefix
        backend:
          service:
            name: collector-slack
            port:
              number: 8004
