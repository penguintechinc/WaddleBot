---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: action-twitch
  labels:
    app: action-twitch
    app.kubernetes.io/component: pushing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: action-twitch
  template:
    metadata:
      labels:
        app: action-twitch
        app.kubernetes.io/component: pushing
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
      - name: db-migrate
        image: waddlebot-migrations:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: waddlebot-config
        - secretRef:
            name: waddlebot-secrets
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
      containers:
      - name: twitch-action
        image: action-twitch:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        ports:
        - name: rest
          containerPort: 8072
          protocol: TCP
        - name: grpc
          containerPort: 50053
          protocol: TCP
        env:
        - name: MODULE_NAME
          value: "twitch-action"
        - name: REST_PORT
          value: "8072"
        - name: GRPC_PORT
          value: "50053"
        - name: DB_HOST
          value: "infra-postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "waddlebot"
        - name: DB_USER
          value: "waddlebot"
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: waddlebot-secrets
              key: POSTGRES_PASSWORD
        - name: REDIS_HOST
          value: "infra-redis"
        envFrom:
        - secretRef:
            name: waddlebot-secrets
            optional: true
        livenessProbe:
          httpGet:
            path: /health
            port: rest
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: rest
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        volumeMounts:
        - name: logs
          mountPath: /var/log/waddlebotlog
        - name: databases
          mountPath: /app/databases
      volumes:
      - name: logs
        emptyDir: {}
      - name: databases
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: action-twitch
  labels:
    app: action-twitch
spec:
  type: ClusterIP
  ports:
  - port: 8072
    targetPort: rest
    protocol: TCP
    name: rest
  - port: 50053
    targetPort: grpc
    protocol: TCP
    name: grpc
  selector:
    app: action-twitch
