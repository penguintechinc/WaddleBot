[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names are self-documenting (pytest convention); S101 is standard
# pytest `assert`; S105/S106 flag fixed test-only secret/env-var names,
# not real credentials.
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
exclude = ["^\\.venv/", "^tests/", "^build/"]

# redis-py/websockets/aiosmtplib ship incomplete/no py.typed type info for
# every call this package makes (e.g. `PubSub.aclose()`) -- same boundary
# override svc-action's own pyproject.toml uses for flask_core/pydal.
[[tool.mypy.overrides]]
module = ["redis.*", "websockets.*", "aiosmtplib.*", "fakeredis.*"]
ignore_missing_imports = true
follow_imports = "skip"
