[package]
name = "waddlebot-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "waddlebot-desktop"

[build-dependencies]
tauri-build = { version = "2.0.3", optional = true }

[dependencies]
tauri = { version = "2.0.5", features = ["custom-protocol"], optional = true }
tauri-plugin-deep-link = { version = "2.0.1", optional = true }
tauri-plugin-updater = { version = "2.10.1", optional = true }
tauri-plugin-opener = { version = "2.0.0", optional = true }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
reqwest = { version = "0.12.10", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1.41.1", features = ["full"] }
async-trait = "0.1.83"
keyring = "3.1.1"
uuid = { version = "1.11.0", features = ["v4", "serde"] }
thiserror = "1.0.65"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["json"] }

[dev-dependencies]
wiremock = "0.6.2"

[features]
default = ["desktop-tauri", "custom-protocol"]
desktop-tauri = ["dep:tauri", "dep:tauri-plugin-deep-link", "dep:tauri-plugin-updater", "dep:tauri-plugin-opener"]
custom-protocol = ["tauri?/custom-protocol"]

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 0

[package.metadata.tauri.bundle]
appimage = "AppImage"
deb = "Deb"
